name: Deploy Canvas Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check Cloudflare token
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to enable Worker deployments."
          fi

      - name: Deploy Worker
        if: steps.credentials.outputs.available == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.90.1 deploy

      - name: Sync provider API keys
        if: steps.credentials.outputs.available == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # Only keys present as repository secrets are written; the Worker keeps the rest.
        run: |
          for name in GEMINI_API_KEY GROQ_API_KEY OPENROUTER_API_KEY; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx --yes wrangler@4.90.1 secret put "$name"
            else
              echo "$name is not a repository secret; leaving the Worker's value unchanged."
            fi
          done
